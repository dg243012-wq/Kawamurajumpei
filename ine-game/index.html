<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノベルゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    }

    /* 16:9 画面コンテナ */
    #game-container {
      --w: min(100vw, 177.7778vh);
      --h: calc(var(--w) * 9 / 16);
      --border-w: max(2px, calc(var(--w) * 0.0038));

      position: relative;
      width: var(--w);
      height: var(--h);
      background-color: #000000;
      overflow: hidden;
      cursor: pointer;
    }

    /* ==================== タイトル画面 ==================== */
    #title-screen {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--h) * 0.14) calc(var(--w) * 0.05) calc(var(--h) * 0.12);
      background-color: #87ceeb;
      cursor: default;
    }

    #title-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #title-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 82%;
    }

    #title-text-box {
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      padding: calc(var(--h) * 0.035) calc(var(--w) * 0.05);
    }

    #title-text {
      font-size: calc(var(--w) * 0.048);
      font-weight: 900;
      color: #000000;
      letter-spacing: 0.08em;
      text-align: center;
    }

    #title-logo-img {
      max-width: 100%;
      max-height: calc(var(--h) * 0.35);
      object-fit: contain;
    }

    #title-menu {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: calc(var(--h) * 0.025);
      width: 34%;
    }

    .title-btn {
      width: 100%;
      padding: calc(var(--h) * 0.022) calc(var(--w) * 0.02);
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      font-family: inherit;
      font-size: calc(var(--w) * 0.024);
      font-weight: 900;
      color: #000000;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .title-btn:hover {
      background-color: #000000;
      color: #ffffff;
    }

    /* ==================== ゲーム画面 ==================== */
    /* 背景画像 */
    #bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* キャラクター立ち絵 */
    #chara-layer {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
      pointer-events: none;
    }

    #chara-image {
      height: 88%;
      max-width: 90%;
      object-fit: contain;
    }

    /* 章タイトル・中央テロップ（## 用） */
    #telop-layer {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 8%;
      z-index: 8;
      pointer-events: none;
    }

    #telop-text {
      font-size: calc(var(--w) * 0.046);
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.08em;
      line-height: 1.5;
      white-space: pre-wrap;
      paint-order: stroke fill;
      -webkit-text-stroke: calc(var(--w) * 0.007) #000000;
    }

    /* 選択肢レイヤー */
    #choice-layer {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 64%;
      display: flex;
      flex-direction: column;
      gap: calc(var(--h) * 0.025);
      z-index: 10;
    }

    .choice-btn {
      width: 100%;
      padding: calc(var(--h) * 0.024) calc(var(--w) * 0.025);
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      font-family: inherit;
      font-size: calc(var(--w) * 0.022);
      font-weight: 900;
      color: #000000;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .choice-btn:hover {
      background-color: #000000;
      color: #ffffff;
    }

    /* UI全体（名前枠＋メッセージウィンドウ） */
    #ui-layer {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 2.5%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* 名前ウィンドウ */
    #name-box {
      width: 21.5%;
      height: calc(var(--h) * 0.095);
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      border-bottom: none;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 calc(var(--w) * 0.01);
      z-index: 6;
    }

    #name-box.hidden {
      visibility: hidden;
    }

    #chara-name {
      font-size: calc(var(--w) * 0.036);
      font-weight: 900;
      color: #000000;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* メッセージウィンドウ */
    #message-box {
      position: relative;
      width: 100%;
      height: calc(var(--h) * 0.345);
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      padding: calc(var(--h) * 0.05) calc(var(--w) * 0.025) calc(var(--h) * 0.095);
      display: flex;
      align-items: center;
    }

    #message-text {
      font-size: calc(var(--w) * 0.024);
      font-weight: 900;
      color: #000000;
      line-height: 1.6;
      white-space: pre-wrap;
      width: 100%;
    }

    /* 右下メニュー（save | Load | log） */
    #menu-box {
      position: absolute;
      right: 0;
      bottom: 0;
      height: calc(var(--h) * 0.088);
      padding: 0 calc(var(--w) * 0.022);
      background-color: #ffffff;
      border-top: var(--border-w) solid #000000;
      border-left: var(--border-w) solid #000000;
      display: flex;
      align-items: center;
      gap: calc(var(--w) * 0.008);
    }

    .menu-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: calc(var(--w) * 0.019);
      font-weight: 900;
      color: #000000;
      cursor: pointer;
      padding: 2px 4px;
    }

    .menu-btn:hover {
      color: #555555;
      text-decoration: underline;
    }

    .menu-sep {
      font-size: calc(var(--w) * 0.019);
      font-weight: 400;
      color: #888888;
    }

    /* トースト通知 */
    #toast {
      position: absolute;
      top: 4%;
      right: 4%;
      background-color: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-size: calc(var(--w) * 0.016);
      font-weight: bold;
      padding: calc(var(--h) * 0.015) calc(var(--w) * 0.02);
      z-index: 60;
      pointer-events: none;
    }

    /* バックログモーダル */
    #log-modal {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      z-index: 55;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
    }

    #log-panel {
      width: 84%;
      height: 80%;
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      display: flex;
      flex-direction: column;
    }

    #log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--h) * 0.02) calc(var(--w) * 0.02);
      border-bottom: var(--border-w) solid #000000;
      font-size: calc(var(--w) * 0.022);
      font-weight: 900;
    }

    #btn-close-log {
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      font-size: calc(var(--w) * 0.016);
      font-weight: 900;
      padding: calc(var(--h) * 0.008) calc(var(--w) * 0.015);
      cursor: pointer;
    }

    #btn-close-log:hover {
      background-color: #000000;
      color: #ffffff;
    }

    #log-list {
      flex: 1;
      overflow-y: auto;
      padding: calc(var(--h) * 0.025) calc(var(--w) * 0.025);
      display: flex;
      flex-direction: column;
      gap: calc(var(--h) * 0.025);
    }

    .log-item {
      border-bottom: 1px solid #cccccc;
      padding-bottom: calc(var(--h) * 0.015);
    }

    .log-name {
      font-size: calc(var(--w) * 0.018);
      font-weight: 900;
      margin-bottom: 4px;
    }

    .log-text {
      font-size: calc(var(--w) * 0.018);
      font-weight: bold;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- ==================== タイトル画面 ==================== -->
    <div id="title-screen">
      <img id="title-bg" src="" alt="">
      <div id="title-header">
        <div id="title-text-box">
          <h1 id="title-text">ノベルゲーム</h1>
        </div>
        <img id="title-logo-img" class="hidden" src="" alt="タイトルロゴ">
      </div>
      <div id="title-menu">
        <button type="button" id="btn-start" class="title-btn">最初から</button>
        <button type="button" id="btn-continue" class="title-btn">続きから</button>
      </div>
    </div>

    <!-- ==================== ゲーム画面 ==================== -->
    <img id="bg-image" src="" alt="">

    <div id="chara-layer">
      <img id="chara-image" src="" alt="">
    </div>

    <!-- 章タイトル・中央テロップ -->
    <div id="telop-layer" class="hidden">
      <div id="telop-text"></div>
    </div>

    <!-- 選択肢 -->
    <div id="choice-layer" class="hidden"></div>

    <!-- メッセージウィンドウUI -->
    <div id="ui-layer">
      <div id="name-box">
        <span id="chara-name"></span>
      </div>

      <div id="message-box">
        <p id="message-text"></p>

        <div id="menu-box">
          <button type="button" id="btn-save" class="menu-btn">save</button>
          <span class="menu-sep">|</span>
          <button type="button" id="btn-load" class="menu-btn">Load</button>
          <span class="menu-sep">|</span>
          <button type="button" id="btn-log" class="menu-btn">log</button>
        </div>
      </div>
    </div>

    <!-- 通知表示 -->
    <div id="toast" class="hidden"></div>

    <!-- バックログ画面 -->
    <div id="log-modal" class="hidden">
      <div id="log-panel">
        <div id="log-header">
          <span>バックログ</span>
          <button type="button" id="btn-close-log">閉じる</button>
        </div>
        <div id="log-list"></div>
      </div>
    </div>
  </div>

  <script src="./scenario.js"></script>

  <script>
    const SAVE_KEY = "novel_game_save_v6";
    const TEXT_SPEED_MS = 30;

    const gameContainer = document.getElementById("game-container");
    const titleScreen = document.getElementById("title-screen");
    const titleBg = document.getElementById("title-bg");
    const titleTextBox = document.getElementById("title-text-box");
    const titleText = document.getElementById("title-text");
    const titleLogoImg = document.getElementById("title-logo-img");

    const bgImage = document.getElementById("bg-image");
    const charaImage = document.getElementById("chara-image");
    const telopLayer = document.getElementById("telop-layer");
    const telopText = document.getElementById("telop-text");
    const choiceLayer = document.getElementById("choice-layer");
    const uiLayer = document.getElementById("ui-layer");
    const nameBox = document.getElementById("name-box");
    const charaName = document.getElementById("chara-name");
    const messageText = document.getElementById("message-text");
    const toast = document.getElementById("toast");
    const logModal = document.getElementById("log-modal");
    const logList = document.getElementById("log-list");

    if (typeof SCRIPT_TEXT === "undefined" || typeof GAME_ASSETS === "undefined") {
      titleScreen.classList.add("hidden");
      charaName.textContent = "エラー";
      messageText.textContent = "scenario.js が見つかりません。index.html と同じフォルダに scenario.js を置いてください。";
      throw new Error("scenario.js not loaded");
    }

    function resolveAsset(type, key) {
      if (!key || key === "none" || key === "hide" || key === "off") return "";
      if (GAME_ASSETS[type] && key in GAME_ASSETS[type]) {
        return GAME_ASSETS[type][key];
      }
      return key;
    }

    // タイトル画面の初期セットアップ
    function initTitleScreen() {
      if (typeof GAME_TITLE !== "undefined" && GAME_TITLE) {
        titleText.textContent = GAME_TITLE;
        document.title = GAME_TITLE;
      }

      const titleBgSrc = resolveAsset("bg", "title") || resolveAsset("bg", "street");
      if (titleBgSrc) {
        titleBg.src = titleBgSrc;
      } else {
        titleBg.style.display = "none";
      }

      const logoSrc = resolveAsset("ui", "titleLogo");
      if (logoSrc) {
        titleLogoImg.src = logoSrc;
        titleLogoImg.classList.remove("hidden");
        titleTextBox.classList.add("hidden");
      }
    }

    // シナリオ解析
    function parseScenario(rawText) {
      const lines = rawText.split(/\r?\n/);
      const steps = [];
      const labels = {};

      let currentBg = "";
      let currentChara = "";
      let currentName = "";
      let currentUiHidden = false;
      let pendingUiPause = false;

      // @ui off のあとにセリフが無いまま切り替わる場合、1クリック待機を挿入する
      const flushUiPauseIfNeeded = () => {
        if (pendingUiPause) {
          steps.push({
            type: "pause",
            bg: currentBg,
            chara: currentChara,
            uiHidden: true
          });
          pendingUiPause = false;
        }
      };

      for (let rawLine of lines) {
        const line = rawLine.trim();
        if (!line || line.startsWith("//")) continue;

        // ラベル定義 (*label)
        if (line.startsWith("*")) {
          flushUiPauseIfNeeded();
          const labelName = line.slice(1).trim();
          labels[labelName] = steps.length;
          continue;
        }

        // タイトルへ戻るコマンド
        if (line === "@title" || line === "-> *title") {
          flushUiPauseIfNeeded();
          steps.push({ type: "title" });
          continue;
        }

        // 無条件ジャンプ (-> *label)
        if (line.startsWith("->")) {
          flushUiPauseIfNeeded();
          const target = line.slice(2).trim().replace(/^\*/, "");
          steps.push({ type: "jump", target });
          continue;
        }

        // クリック待機コマンド (@wait)
        if (line === "@wait") {
          pendingUiPause = false;
          steps.push({
            type: "pause",
            bg: currentBg,
            chara: currentChara,
            uiHidden: currentUiHidden
          });
          continue;
        }

        // 背景変更 (@bg name / @bg off / @bg だけの空白)
        if (line === "@bg" || line.startsWith("@bg ")) {
          const val = line.slice(3).trim();
          currentBg = (val === "off" || val === "none" || val === "hide") ? "" : val;
          continue;
        }

        // キャラ変更 (@chara name / @chara off / @chara だけの空白)
        if (line === "@chara" || line.startsWith("@chara ")) {
          const val = line.slice(6).trim();
          currentChara = (val === "off" || val === "none" || val === "hide") ? "" : val;
          continue;
        }

        // メッセージウィンドウ表示オンオフ (@ui on / @ui off)
        if (line === "@ui" || line.startsWith("@ui ")) {
          const mode = line.slice(3).trim();
          const nextHidden = (mode === "" || mode === "hide" || mode === "none" || mode === "off");
          if (currentUiHidden && !nextHidden) {
            flushUiPauseIfNeeded();
          }
          currentUiHidden = nextHidden;
          if (currentUiHidden) {
            pendingUiPause = true;
          }
          continue;
        }

        // 章タイトル・中央テロップ（## 見出し）
        if (line.startsWith("##")) {
          pendingUiPause = false;
          const text = line.slice(2).trim();
          steps.push({
            type: "telop",
            text,
            bg: currentBg,
            chara: currentChara
          });
          continue;
        }

        // 名前変更（# 名前 / # off / # だけの空白）
        if (line === "#" || line.startsWith("# ")) {
          const val = line.slice(1).trim();
          currentName = (val === "off" || val === "none" || val === "hide") ? "" : val;
          continue;
        }

        // 選択肢
        if (line.startsWith("?")) {
          pendingUiPause = false;
          const choiceStr = line.slice(1).trim();
          const choices = choiceStr.split("|").map(part => {
            const [label, targetRaw] = part.split("->");
            return {
              label: label ? label.trim() : "選択",
              target: targetRaw ? targetRaw.trim().replace(/^\*/, "") : ""
            };
          });

          const prevStep = steps[steps.length - 1];
          if (prevStep && prevStep.type === "say") {
            prevStep.choices = choices;
          } else {
            steps.push({
              type: "say",
              name: currentName,
              text: "",
              bg: currentBg,
              chara: currentChara,
              uiHidden: currentUiHidden,
              choices
            });
          }
          continue;
        }

        // 通常セリフ
        pendingUiPause = false;
        steps.push({
          type: "say",
          name: currentName,
          text: line,
          bg: currentBg,
          chara: currentChara,
          uiHidden: currentUiHidden,
          choices: null
        });
      }

      flushUiPauseIfNeeded();
      return { steps, labels };
    }

    const { steps: GAME_STEPS, labels: GAME_LABELS } = parseScenario(SCRIPT_TEXT);

    let currentIndex = 0;
    let displayedText = "";
    let typingTimer = null;
    let isTyping = false;
    let isChoosing = false;
    let historyLog = [];

    function returnToTitle() {
      clearInterval(typingTimer);
      isTyping = false;
      hideChoices();
      telopLayer.classList.add("hidden");
      logModal.classList.add("hidden");
      currentIndex = 0;
      titleScreen.classList.remove("hidden");
    }

    function renderChoices(choices) {
      isChoosing = true;
      choiceLayer.innerHTML = "";

      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.textContent = choice.label;

        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          historyLog.push({
            index: currentIndex,
            name: "【選択】",
            text: choice.label
          });
          hideChoices();
          jumpToLabel(choice.target);
        });

        choiceLayer.appendChild(btn);
      });

      choiceLayer.classList.remove("hidden");
    }

    function hideChoices() {
      isChoosing = false;
      choiceLayer.innerHTML = "";
      choiceLayer.classList.add("hidden");
    }

    function jumpToLabel(labelName) {
      if (labelName === "title") {
        returnToTitle();
        return;
      }
      if (!(labelName in GAME_LABELS)) {
        showToast(`飛び先「*${labelName}」が見つかりません`);
        return;
      }
      currentIndex = GAME_LABELS[labelName];
      renderStep(currentIndex);
    }

    function renderStep(index, skipTyping = false) {
      let guard = 0;
      while (GAME_STEPS[index] && GAME_STEPS[index].type === "jump") {
        const target = GAME_STEPS[index].target;
        if (target === "title") {
          returnToTitle();
          return;
        }
        if (!(target in GAME_LABELS) || guard > 50) {
          showToast(`飛び先「*${target}」が見つかりません`);
          return;
        }
        index = GAME_LABELS[target];
        currentIndex = index;
        guard++;
      }

      const step = GAME_STEPS[index];
      if (!step || step.type === "title") {
        returnToTitle();
        return;
      }

      hideChoices();
      clearInterval(typingTimer);
      isTyping = false;

      // 背景更新
      const bgSrc = resolveAsset("bg", step.bg);
      if (bgSrc) {
        bgImage.src = bgSrc;
        bgImage.style.display = "block";
      } else {
        bgImage.style.display = "none";
      }

      // 立ち絵更新
      const charaSrc = resolveAsset("chara", step.chara);
      if (charaSrc) {
        charaImage.src = charaSrc;
        charaImage.style.display = "block";
      } else {
        charaImage.style.display = "none";
      }

      // クリック待機（@ui off 単体や @wait）の場合
      if (step.type === "pause") {
        telopLayer.classList.add("hidden");
        if (step.uiHidden) {
          uiLayer.classList.add("hidden");
        } else {
          uiLayer.classList.remove("hidden");
        }
        return;
      }

      // 章タイトル・中央テロップ（##）の場合
      if (step.type === "telop") {
        uiLayer.classList.add("hidden");
        telopText.textContent = step.text;
        telopLayer.classList.remove("hidden");

        const lastLog = historyLog[historyLog.length - 1];
        if (step.text && (!lastLog || lastLog.index !== index)) {
          historyLog.push({
            index: index,
            name: "【章】",
            text: step.text
          });
        }
        return;
      }

      // 通常セリフの場合：テロップを消す
      telopLayer.classList.add("hidden");

      // メッセージウィンドウの表示／非表示
      if (step.uiHidden) {
        uiLayer.classList.add("hidden");
      } else {
        uiLayer.classList.remove("hidden");
      }

      // 名前枠の表示／非表示
      if (step.name) {
        charaName.textContent = step.name;
        nameBox.classList.remove("hidden");
      } else {
        charaName.textContent = "";
        nameBox.classList.add("hidden");
      }

      // バックログ追加
      const lastLog = historyLog[historyLog.length - 1];
      if (step.text && (!lastLog || lastLog.index !== index)) {
        historyLog.push({
          index: index,
          name: step.name || "",
          text: step.text
        });
      }

      const onTextComplete = () => {
        isTyping = false;
        if (step.choices && step.choices.length > 0) {
          renderChoices(step.choices);
        }
      };

      if (skipTyping || !step.text || step.uiHidden) {
        messageText.textContent = step.text;
        onTextComplete();
        return;
      }

      isTyping = true;
      displayedText = "";
      messageText.textContent = "";
      let charPos = 0;

      typingTimer = setInterval(() => {
        displayedText += step.text[charPos];
        messageText.textContent = displayedText;
        charPos++;

        if (charPos >= step.text.length) {
          clearInterval(typingTimer);
          onTextComplete();
        }
      }, TEXT_SPEED_MS);
    }

    function advance() {
      if (!titleScreen.classList.contains("hidden")) return;
      if (!logModal.classList.contains("hidden")) return;
      if (isChoosing) return;

      const step = GAME_STEPS[currentIndex];
      if (!step) {
        returnToTitle();
        return;
      }

      if (isTyping) {
        clearInterval(typingTimer);
        messageText.textContent = step.text;
        isTyping = false;
        if (step.choices && step.choices.length > 0) {
          renderChoices(step.choices);
        }
        return;
      }

      if (currentIndex < GAME_STEPS.length - 1) {
        currentIndex++;
        renderStep(currentIndex);
      } else {
        returnToTitle();
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add("hidden");
      }, 1800);
    }

    document.getElementById("btn-start").addEventListener("click", (e) => {
      e.stopPropagation();
      currentIndex = 0;
      historyLog = [];
      titleScreen.classList.add("hidden");
      renderStep(currentIndex);
    });

    document.getElementById("btn-continue").addEventListener("click", (e) => {
      e.stopPropagation();
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) {
        showToast("セーブデータがありません");
        return;
      }
      const saveData = JSON.parse(raw);
      currentIndex = saveData.currentIndex || 0;
      historyLog = saveData.historyLog || [];
      titleScreen.classList.add("hidden");
      renderStep(currentIndex, true);
      showToast("ロードしました");
    });

    gameContainer.addEventListener("click", advance);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        advance();
      }
    });

    document.getElementById("btn-save").addEventListener("click", (e) => {
      e.stopPropagation();
      const saveData = { currentIndex, historyLog };
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
      showToast("セーブしました");
    });

    document.getElementById("btn-load").addEventListener("click", (e) => {
      e.stopPropagation();
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) {
        showToast("セーブデータがありません");
        return;
      }
      const saveData = JSON.parse(raw);
      currentIndex = saveData.currentIndex || 0;
      historyLog = saveData.historyLog || [];
      renderStep(currentIndex, true);
      showToast("ロードしました");
    });

    document.getElementById("btn-log").addEventListener("click", (e) => {
      e.stopPropagation();
      logList.innerHTML = historyLog.map(item => `
        <div class="log-item">
          <div class="log-name">${item.name || "（地の文）"}</div>
          <div class="log-text">${item.text}</div>
        </div>
      `).join("");
      logModal.classList.remove("hidden");
      logList.scrollTop = logList.scrollHeight;
    });

    document.getElementById("btn-close-log").addEventListener("click", (e) => {
      e.stopPropagation();
      logModal.classList.add("hidden");
    });
    logModal.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    initTitleScreen();
  </script>
</body>
</html>
