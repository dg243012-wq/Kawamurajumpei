<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノベルゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    }

    /* 16:9 画面コンテナ */
    #game-container {
      --w: min(100vw, 177.7778vh);
      --h: calc(var(--w) * 9 / 16);
      --border-w: max(2px, calc(var(--w) * 0.0038));

      position: relative;
      width: var(--w);
      height: var(--h);
      background-color: #000000;
      overflow: hidden;
      cursor: pointer;
    }

    /* ==================== タイトル画面 ==================== */
    #title-screen {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--h) * 0.14) calc(var(--w) * 0.05) calc(var(--h) * 0.12);
      background-color: #87ceeb;
      cursor: default;
    }

    #title-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #title-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 82%;
    }

    #title-text-box {
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      padding: calc(var(--h) * 0.035) calc(var(--w) * 0.05);
    }

    #title-text {
      font-size: calc(var(--w) * 0.048);
      font-weight: 900;
      color: #000000;
      letter-spacing: 0.08em;
      text-align: center;
    }

    #title-logo-img {
      max-width: 100%;
      max-height: calc(var(--h) * 0.35);
      object-fit: contain;
    }

    #title-menu {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: calc(var(--h) * 0.025);
      width: 34%;
    }

    .title-btn {
      width: 100%;
      padding: calc(var(--h) * 0.022) calc(var(--w) * 0.02);
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      font-family: inherit;
      font-size: calc(var(--w) * 0.024);
      font-weight: 900;
      color: #000000;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .title-btn:hover {
      background-color: #000000;
      color: #ffffff;
    }

    /* ==================== ゲーム画面 ==================== */
    /* 背景画像 */
    #bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* キャラクター立ち絵レイヤー */
    #chara-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    /* 動的に生成されるキャラクターオブジェクト */
    .chara-obj {
      position: absolute;
      bottom: 0;
      height: 88%;
      width: auto;
      max-width: none;
      object-fit: contain;
      will-change: left, transform, opacity;
    }

    /* 章タイトル・中央テロップ（## 用） */
    #telop-layer {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 8%;
      z-index: 8;
      pointer-events: none;
    }

    #telop-text {
      font-size: calc(var(--w) * 0.046);
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.08em;
      line-height: 1.5;
      white-space: pre-wrap;
      paint-order: stroke fill;
      -webkit-text-stroke: calc(var(--w) * 0.007) #000000;
    }

    /* 選択肢レイヤー */
    #choice-layer {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 64%;
      display: flex;
      flex-direction: column;
      gap: calc(var(--h) * 0.025);
      z-index: 10;
    }

    .choice-btn {
      width: 100%;
      padding: calc(var(--h) * 0.024) calc(var(--w) * 0.025);
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      font-family: inherit;
      font-size: calc(var(--w) * 0.022);
      font-weight: 900;
      color: #000000;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .choice-btn:hover {
      background-color: #000000;
      color: #ffffff;
    }

    /* UI全体（名前枠＋メッセージウィンドウ） */
    #ui-layer {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 2.5%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* 名前ウィンドウ */
    #name-box {
      width: 21.5%;
      height: calc(var(--h) * 0.095);
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      border-bottom: none;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 calc(var(--w) * 0.01);
      z-index: 6;
    }

    #name-box.hidden {
      visibility: hidden;
    }

    #chara-name {
      font-size: calc(var(--w) * 0.036);
      font-weight: 900;
      color: #000000;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* メッセージウィンドウ */
    #message-box {
      position: relative;
      width: 100%;
      height: calc(var(--h) * 0.345);
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      padding: calc(var(--h) * 0.05) calc(var(--w) * 0.025) calc(var(--h) * 0.095);
      display: flex;
      align-items: center;
    }

    #message-text {
      font-size: calc(var(--w) * 0.024);
      font-weight: 900;
      color: #000000;
      line-height: 1.6;
      white-space: pre-wrap;
      width: 100%;
    }

    /* クリックできる用語（色付き単語） */
    .glossary-word {
      color: #0055cc;
      text-decoration: underline;
      text-decoration-thickness: max(2px, calc(var(--w) * 0.0022));
      text-underline-offset: 0.16em;
      cursor: pointer;
      padding: 0 2px;
      border-radius: 3px;
      transition: background-color 0.15s, color 0.15s;
    }

    .glossary-word:hover {
      background-color: #0055cc;
      color: #ffffff;
    }

    /* 右下メニュー（save | Load | log） */
    #menu-box {
      position: absolute;
      right: 0;
      bottom: 0;
      height: calc(var(--h) * 0.088);
      padding: 0 calc(var(--w) * 0.022);
      background-color: #ffffff;
      border-top: var(--border-w) solid #000000;
      border-left: var(--border-w) solid #000000;
      display: flex;
      align-items: center;
      gap: calc(var(--w) * 0.008);
    }

    .menu-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: calc(var(--w) * 0.019);
      font-weight: 900;
      color: #000000;
      cursor: pointer;
      padding: 2px 4px;
    }

    .menu-btn:hover {
      color: #555555;
      text-decoration: underline;
    }

    .menu-sep {
      font-size: calc(var(--w) * 0.019);
      font-weight: 400;
      color: #888888;
    }

    /* トースト通知 */
    #toast {
      position: absolute;
      top: 4%;
      right: 4%;
      background-color: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-size: calc(var(--w) * 0.016);
      font-weight: bold;
      padding: calc(var(--h) * 0.015) calc(var(--w) * 0.02);
      z-index: 70;
      pointer-events: none;
    }

    /* バックログモーダル */
    #log-modal {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      z-index: 55;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
    }

    #log-panel {
      width: 84%;
      height: 80%;
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      display: flex;
      flex-direction: column;
    }

    #log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--h) * 0.02) calc(var(--w) * 0.02);
      border-bottom: var(--border-w) solid #000000;
      font-size: calc(var(--w) * 0.022);
      font-weight: 900;
    }

    #btn-close-log {
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      font-size: calc(var(--w) * 0.016);
      font-weight: 900;
      padding: calc(var(--h) * 0.008) calc(var(--w) * 0.015);
      cursor: pointer;
    }

    #btn-close-log:hover {
      background-color: #000000;
      color: #ffffff;
    }

    #log-list {
      flex: 1;
      overflow-y: auto;
      padding: calc(var(--h) * 0.025) calc(var(--w) * 0.025);
      display: flex;
      flex-direction: column;
      gap: calc(var(--h) * 0.025);
    }

    .log-item {
      border-bottom: 1px solid #cccccc;
      padding-bottom: calc(var(--h) * 0.015);
    }

    .log-name {
      font-size: calc(var(--w) * 0.018);
      font-weight: 900;
      margin-bottom: 4px;
    }

    .log-text {
      font-size: calc(var(--w) * 0.018);
      font-weight: bold;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* ==================== 用語解説モーダル ==================== */
    #glossary-modal {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 65;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
    }

    #glossary-panel {
      width: 68%;
      max-height: 68%;
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      display: flex;
      flex-direction: column;
    }

    #glossary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--h) * 0.022) calc(var(--w) * 0.025);
      border-bottom: var(--border-w) solid #000000;
      background-color: #f4f7fb;
    }

    #glossary-title {
      font-size: calc(var(--w) * 0.026);
      font-weight: 900;
      color: #0055cc;
    }

    #btn-close-glossary {
      background-color: #ffffff;
      border: var(--border-w) solid #000000;
      font-family: inherit;
      font-size: calc(var(--w) * 0.017);
      font-weight: 900;
      padding: calc(var(--h) * 0.008) calc(var(--w) * 0.018);
      cursor: pointer;
    }

    #btn-close-glossary:hover {
      background-color: #000000;
      color: #ffffff;
    }

    #glossary-body {
      padding: calc(var(--h) * 0.035) calc(var(--w) * 0.028);
      overflow-y: auto;
      font-size: calc(var(--w) * 0.021);
      font-weight: bold;
      color: #000000;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- ==================== タイトル画面 ==================== -->
    <div id="title-screen">
      <img id="title-bg" src="" alt="">
      <div id="title-header">
        <div id="title-text-box">
          <h1 id="title-text">ノベルゲーム</h1>
        </div>
        <img id="title-logo-img" class="hidden" src="" alt="タイトルロゴ">
      </div>
      <div id="title-menu">
        <button type="button" id="btn-start" class="title-btn">最初から</button>
        <button type="button" id="btn-continue" class="title-btn">続きから</button>
      </div>
    </div>

    <!-- ==================== ゲーム画面 ==================== -->
    <img id="bg-image" src="" alt="">

    <!-- キャラクターオブジェクト生成レイヤー -->
    <div id="chara-layer"></div>

    <!-- 章タイトル・中央テロップ -->
    <div id="telop-layer" class="hidden">
      <div id="telop-text"></div>
    </div>

    <!-- 選択肢 -->
    <div id="choice-layer" class="hidden"></div>

    <!-- メッセージウィンドウUI -->
    <div id="ui-layer">
      <div id="name-box">
        <span id="chara-name"></span>
      </div>

      <div id="message-box">
        <p id="message-text"></p>

        <div id="menu-box">
          <button type="button" id="btn-save" class="menu-btn">save</button>
          <span class="menu-sep">|</span>
          <button type="button" id="btn-load" class="menu-btn">Load</button>
          <span class="menu-sep">|</span>
          <button type="button" id="btn-log" class="menu-btn">log</button>
        </div>
      </div>
    </div>

    <!-- 通知表示 -->
    <div id="toast" class="hidden"></div>

    <!-- バックログ画面 -->
    <div id="log-modal" class="hidden">
      <div id="log-panel">
        <div id="log-header">
          <span>バックログ</span>
          <button type="button" id="btn-close-log">閉じる</button>
        </div>
        <div id="log-list"></div>
      </div>
    </div>

    <!-- 用語解説ウィンドウ -->
    <div id="glossary-modal" class="hidden">
      <div id="glossary-panel">
        <div id="glossary-header">
          <span id="glossary-title"></span>
          <button type="button" id="btn-close-glossary">閉じる</button>
        </div>
        <div id="glossary-body"></div>
      </div>
    </div>
  </div>

  <script src="./scenario.js"></script>

  <script>
    const SAVE_KEY = "novel_game_save_v8";
    const TEXT_SPEED_MS = 30;
    const SLIDE_DURATION_MS = 500; // スライド移動にかかる時間（ミリ秒）
    const FADE_DURATION_MS = 280;  // 無からの出現・消滅にかかる時間（ミリ秒）

    const gameContainer = document.getElementById("game-container");
    const titleScreen = document.getElementById("title-screen");
    const titleBg = document.getElementById("title-bg");
    const titleTextBox = document.getElementById("title-text-box");
    const titleText = document.getElementById("title-text");
    const titleLogoImg = document.getElementById("title-logo-img");

    const bgImage = document.getElementById("bg-image");
    const charaLayer = document.getElementById("chara-layer");
    const telopLayer = document.getElementById("telop-layer");
    const telopText = document.getElementById("telop-text");
    const choiceLayer = document.getElementById("choice-layer");
    const uiLayer = document.getElementById("ui-layer");
    const nameBox = document.getElementById("name-box");
    const charaName = document.getElementById("chara-name");
    const messageText = document.getElementById("message-text");
    const toast = document.getElementById("toast");
    const logModal = document.getElementById("log-modal");
    const logList = document.getElementById("log-list");
    const glossaryModal = document.getElementById("glossary-modal");
    const glossaryTitle = document.getElementById("glossary-title");
    const glossaryBody = document.getElementById("glossary-body");

    if (typeof SCRIPT_TEXT === "undefined" || typeof GAME_ASSETS === "undefined") {
      titleScreen.classList.add("hidden");
      charaName.textContent = "エラー";
      messageText.textContent = "scenario.js が見つかりません。index.html と同じフォルダに scenario.js を置いてください。";
      throw new Error("scenario.js not loaded");
    }

    const GLOSSARY_DATA = (typeof GAME_GLOSSARY !== "undefined" && GAME_GLOSSARY) ? GAME_GLOSSARY : {};

    function resolveAsset(type, key) {
      if (!key || key === "none" || key === "hide" || key === "off" || key === "無") return "";
      if (GAME_ASSETS[type] && key in GAME_ASSETS[type]) {
        return GAME_ASSETS[type][key];
      }
      return key;
    }

    // ==================== キャラクター位置・オブジェクト管理 ====================
    // 位置名を内部コードに正規化
    function normalizePos(raw) {
      if (!raw) return "center";
      const s = raw.trim();
      if (s === "中心" || s === "中央" || s === "center") return "center";
      if (s === "右" || s === "right") return "right";
      if (s === "左" || s === "left") return "left";
      if (s === "右画面外" || s === "out_right") return "out_right";
      if (s === "左画面外" || s === "out_left") return "out_left";
      if (s === "無" || s === "none" || s === "off" || s === "hide") return "none";
      return null;
    }

    function isOffscreenPos(pos) {
      return pos === "out_left" || pos === "out_right";
    }

    function isVisibleOnScreenPos(pos) {
      return pos === "center" || pos === "left" || pos === "right";
    }

    // 各位置のCSS座標（left と translateX）
    function getPosStyle(pos) {
      switch (pos) {
        case "out_left":
          // 要素の右端が画面左端（0%）に一致＝完全に左画面外
          return { left: "0%", transform: "translateX(-100%)" };
        case "left":
          return { left: "25%", transform: "translateX(-50%)" };
        case "center":
          return { left: "50%", transform: "translateX(-50%)" };
        case "right":
          return { left: "75%", transform: "translateX(-50%)" };
        case "out_right":
          // 要素の左端が画面右端（100%）に一致＝完全に右画面外
          return { left: "100%", transform: "translateX(0%)" };
        default:
          return { left: "50%", transform: "translateX(-50%)" };
      }
    }

    // @chara / @move コマンドの引数を解析
    function parseCharaDirective(argStr, prevCharaKey) {
      const trimmed = argStr.trim();
      if (!trimmed || trimmed === "無" || trimmed === "off" || trimmed === "none" || trimmed === "hide") {
        return { key: "", from: null, to: "none", explicitFrom: false };
      }

      // 「->」が含まれている場合（A地点 -> B地点）
      if (trimmed.includes("->")) {
        const [leftPart, rightPart] = trimmed.split("->");
        const tokens = leftPart.trim().split(/\s+/).filter(Boolean);
        let key = prevCharaKey;
        let fromRaw = "";

        if (tokens.length === 1) {
          const maybePos = normalizePos(tokens[0]);
          if (maybePos) {
            fromRaw = tokens[0];
          } else {
            key = tokens[0];
          }
        } else if (tokens.length >= 2) {
          key = tokens[0];
          fromRaw = tokens[1];
        }

        const fromPos = fromRaw ? (normalizePos(fromRaw) || "center") : null;
        const toPos = normalizePos(rightPart.trim()) || "center";
        return {
          key,
          from: fromPos,
          to: toPos,
          explicitFrom: Boolean(fromPos)
        };
      }

      // 「->」がない場合（例: "ine" や "ine 右" や "右"）
      const tokens = trimmed.split(/\s+/).filter(Boolean);
      if (tokens.length === 1) {
        const maybePos = normalizePos(tokens[0]);
        if (maybePos) {
          return {
            key: maybePos === "none" ? "" : prevCharaKey,
            from: null,
            to: maybePos,
            explicitFrom: false
          };
        }
        // キャラ名のみ指定 → デフォルトは「中心」
        return {
          key: tokens[0],
          from: null,
          to: "center",
          explicitFrom: false
        };
      } else {
        const key = tokens[0];
        const toPos = normalizePos(tokens[1]) || "center";
        return {
          key: toPos === "none" ? "" : key,
          from: null,
          to: toPos,
          explicitFrom: false
        };
      }
    }

    // 現在アクティブなキャラクターオブジェクト状態
    let activeCharaEl = null;
    let activeCharaSrc = "";
    let activeCharaPos = "none";

    function removeElementSafely(el) {
      if (el && el.parentNode) {
        el.parentNode.removeChild(el);
      }
    }

    function clearAllCharaObjects() {
      charaLayer.innerHTML = "";
      activeCharaEl = null;
      activeCharaSrc = "";
      activeCharaPos = "none";
    }

    function createCharaElement(src, pos, opacity = 1) {
      const img = document.createElement("img");
      img.src = src;
      img.alt = "";
      img.className = "chara-obj";
      const st = getPosStyle(pos);
      img.style.transition = "none";
      img.style.left = st.left;
      img.style.transform = st.transform;
      img.style.opacity = String(opacity);
      charaLayer.appendChild(img);
      return img;
    }

    // キャラクターの配置・移動・生成・消去を実行
    function updateCharacterObject(step, immediate = false) {
      const src = resolveAsset("chara", step.chara);
      const explicitFrom = step.charaExplicitFrom ? step.charaFrom : null;
      const toPos = step.charaTo || (src ? "center" : "none");

      // 画像が未設定かつ移動先が無の場合
      if (!src && toPos === "none" && !activeCharaEl) {
        clearAllCharaObjects();
        return;
      }

      // ロード時や即時反映時（アニメーションなし）
      if (immediate) {
        clearAllCharaObjects();
        if (src && isVisibleOnScreenPos(toPos)) {
          activeCharaEl = createCharaElement(src, toPos, 1);
          activeCharaSrc = src;
          activeCharaPos = toPos;
        }
        return;
      }

      // 実行中の退場アニメーション要素があれば先に片付ける
      Array.from(charaLayer.children).forEach(child => {
        if (child !== activeCharaEl) {
          removeElementSafely(child);
        }
      });

      // 実質的なA地点（出発地点）を決定
      const fromPos = explicitFrom || (activeCharaEl ? activeCharaPos : "none");

      // --- パターン1：B地点が「無」の場合（オブジェクトを消す） ---
      if (toPos === "none") {
        if (!activeCharaEl) {
          clearAllCharaObjects();
          return;
        }
        const dyingEl = activeCharaEl;
        activeCharaEl = null;
        activeCharaSrc = "";
        activeCharaPos = "none";

        // A地点が明示されていたら一旦そこに置いてから消す
        if (explicitFrom && isVisibleOnScreenPos(explicitFrom)) {
          const st = getPosStyle(explicitFrom);
          dyingEl.style.transition = "none";
          dyingEl.style.left = st.left;
          dyingEl.style.transform = st.transform;
          void dyingEl.offsetWidth;
        }

        dyingEl.style.transition = `opacity ${FADE_DURATION_MS}ms ease`;
        dyingEl.style.opacity = "0";
        setTimeout(() => removeElementSafely(dyingEl), FADE_DURATION_MS + 30);
        return;
      }

      if (!src) {
        clearAllCharaObjects();
        return;
      }

      // --- パターン2：A地点が「画面外」（左画面外 / 右画面外）の場合 ---
      // → 新しくオブジェクトを画面外に生み出し、B地点へスライドさせる
      if (isOffscreenPos(fromPos)) {
        if (activeCharaEl) {
          removeElementSafely(activeCharaEl);
          activeCharaEl = null;
        }

        const newEl = createCharaElement(src, fromPos, 1);
        void newEl.offsetWidth; // A地点をブラウザに確定させる

        // B地点も画面外の場合はスライド後に出きったタイミングで消去
        if (isOffscreenPos(toPos)) {
          activeCharaEl = null;
          activeCharaSrc = "";
          activeCharaPos = "none";

          const endSt = getPosStyle(toPos);
          newEl.style.transition = `left ${SLIDE_DURATION_MS}ms ease, transform ${SLIDE_DURATION_MS}ms ease`;
          newEl.style.left = endSt.left;
          newEl.style.transform = endSt.transform;

          let removed = false;
          const cleanup = () => {
            if (removed) return;
            removed = true;
            removeElementSafely(newEl);
          };
          newEl.addEventListener("transitionend", cleanup, { once: true });
          setTimeout(cleanup, SLIDE_DURATION_MS + 60);
        } else {
          // B地点（中心・右・左）へスライドイン
          activeCharaEl = newEl;
          activeCharaSrc = src;
          activeCharaPos = toPos;

          const endSt = getPosStyle(toPos);
          newEl.style.transition = `left ${SLIDE_DURATION_MS}ms ease, transform ${SLIDE_DURATION_MS}ms ease`;
          newEl.style.left = endSt.left;
          newEl.style.transform = endSt.transform;
        }
        return;
      }

      // --- パターン3：A地点が「無」の場合 ---
      // → 新しくオブジェクトを生み出す
      if (fromPos === "none") {
        if (activeCharaEl) {
          removeElementSafely(activeCharaEl);
          activeCharaEl = null;
        }

        if (isOffscreenPos(toPos)) {
          // 無 -> 画面外（画面外はもともと見えないので存在しない状態のまま）
          activeCharaEl = null;
          activeCharaSrc = "";
          activeCharaPos = "none";
          return;
        }

        // B地点（中心・右・左）に新しいオブジェクトを生み出す
        const newEl = createCharaElement(src, toPos, 0);
        void newEl.offsetWidth;
        newEl.style.transition = `opacity ${FADE_DURATION_MS}ms ease`;
        newEl.style.opacity = "1";

        activeCharaEl = newEl;
        activeCharaSrc = src;
        activeCharaPos = toPos;
        return;
      }

      // --- パターン4：A地点が画面内（中心・右・左）の場合 ---
      let targetEl = activeCharaEl;

      // まだオブジェクトが存在しない、または明示的にA地点から生み直す場合
      if (!targetEl) {
        targetEl = createCharaElement(src, fromPos, 1);
      } else {
        // 画像差分が変わっていれば差し替え
        if (activeCharaSrc !== src) {
          targetEl.src = src;
        }
        // A地点が明示されていて現在位置と異なる場合は一度A地点へ配置
        if (explicitFrom && activeCharaPos !== explicitFrom) {
          const startSt = getPosStyle(explicitFrom);
          targetEl.style.transition = "none";
          targetEl.style.left = startSt.left;
          targetEl.style.transform = startSt.transform;
        }
      }

      void targetEl.offsetWidth; // A地点を確定

      // B地点が「画面外」の場合 → スライドし、完全に画面外に出たタイミングで消去
      if (isOffscreenPos(toPos)) {
        activeCharaEl = null;
        activeCharaSrc = "";
        activeCharaPos = "none";

        const endSt = getPosStyle(toPos);
        targetEl.style.transition = `left ${SLIDE_DURATION_MS}ms ease, transform ${SLIDE_DURATION_MS}ms ease`;
        targetEl.style.left = endSt.left;
        targetEl.style.transform = endSt.transform;

        let removed = false;
        const cleanup = () => {
          if (removed) return;
          removed = true;
          removeElementSafely(targetEl);
        };
        targetEl.addEventListener("transitionend", cleanup, { once: true });
        setTimeout(cleanup, SLIDE_DURATION_MS + 60);
        return;
      }

      // B地点が画面内（中心・右・左）の場合 → A地点からB地点へスライド移動
      activeCharaEl = targetEl;
      activeCharaSrc = src;
      activeCharaPos = toPos;

      const endSt = getPosStyle(toPos);
      targetEl.style.transition = `left ${SLIDE_DURATION_MS}ms ease, transform ${SLIDE_DURATION_MS}ms ease, opacity ${FADE_DURATION_MS}ms ease`;
      targetEl.style.left = endSt.left;
      targetEl.style.transform = endSt.transform;
      targetEl.style.opacity = "1";
    }

    // ==================== 用語解説ウィンドウ ====================
    function openGlossary(key, fallbackLabel = "") {
      const title = key || fallbackLabel;
      const desc = GLOSSARY_DATA[key] || GLOSSARY_DATA[fallbackLabel] || "（この単語の説明はまだ登録されていません）";
      glossaryTitle.textContent = title;
      glossaryBody.textContent = desc;
      glossaryModal.classList.remove("hidden");
    }

    function closeGlossary() {
      glossaryModal.classList.add("hidden");
    }

    function parseMessageSegments(rawText) {
      if (!rawText) return [];
      const segments = [];
      const regex = /\[\[([^\]]+)\]\]/g;
      let lastIndex = 0;
      let match;

      while ((match = regex.exec(rawText)) !== null) {
        if (match.index > lastIndex) {
          segments.push({
            type: "text",
            text: rawText.slice(lastIndex, match.index)
          });
        }
        const inner = match[1];
        const parts = inner.split("|");
        const display = parts[0].trim();
        const key = (parts[1] ? parts[1] : parts[0]).trim();
        segments.push({
          type: "term",
          text: display,
          key: key
        });
        lastIndex = regex.lastIndex;
      }

      if (lastIndex < rawText.length) {
        segments.push({
          type: "text",
          text: rawText.slice(lastIndex)
        });
      }
      return segments;
    }

    function buildRichTextNodes(container, rawText) {
      container.innerHTML = "";
      const segments = parseMessageSegments(rawText);
      const items = [];

      for (const seg of segments) {
        if (seg.type === "term") {
          const span = document.createElement("span");
          span.className = "glossary-word";
          span.textContent = seg.text;
          span.addEventListener("click", (e) => {
            e.stopPropagation();
            openGlossary(seg.key, seg.text);
          });
          container.appendChild(span);
          items.push({ node: span, fullText: seg.text });
        } else {
          const textNode = document.createTextNode(seg.text);
          container.appendChild(textNode);
          items.push({ node: textNode, fullText: seg.text });
        }
      }
      return items;
    }

    // ==================== タイトル画面 ====================
    function initTitleScreen() {
      if (typeof GAME_TITLE !== "undefined" && GAME_TITLE) {
        titleText.textContent = GAME_TITLE;
        document.title = GAME_TITLE;
      }

      const titleBgSrc = resolveAsset("bg", "title") || resolveAsset("bg", "street");
      if (titleBgSrc) {
        titleBg.src = titleBgSrc;
      } else {
        titleBg.style.display = "none";
      }

      const logoSrc = resolveAsset("ui", "titleLogo");
      if (logoSrc) {
        titleLogoImg.src = logoSrc;
        titleLogoImg.classList.remove("hidden");
        titleTextBox.classList.add("hidden");
      }
    }

    // ==================== シナリオ解析 ====================
    function parseScenario(rawText) {
      const lines = rawText.split(/\r?\n/);
      const steps = [];
      const labels = {};

      let currentBg = "";
      let currentChara = "";
      let pendingCharaFrom = null;
      let pendingCharaExplicitFrom = false;
      let currentCharaTo = "none";
      let currentName = "";
      let currentUiHidden = false;
      let pendingUiPause = false;
      let pendingCharaMove = false;

      // 次のステップにキャラ情報を引き渡すヘルパー
      const consumeCharaState = () => {
        const state = {
          chara: currentChara,
          charaFrom: pendingCharaFrom,
          charaExplicitFrom: pendingCharaExplicitFrom,
          charaTo: currentCharaTo
        };
        // 一度移動・出現を消費したら、次の行では現在位置に留まるようにリセット
        pendingCharaFrom = null;
        pendingCharaExplicitFrom = false;
        pendingCharaMove = false;
        if (isOffscreenPos(currentCharaTo) || currentCharaTo === "none") {
          currentCharaTo = "none";
          if (currentCharaTo === "none") currentChara = "";
        }
        return state;
      };

      const flushPendingPauseIfNeeded = () => {
        if (pendingUiPause || pendingCharaMove) {
          const charaState = consumeCharaState();
          steps.push({
            type: "pause",
            bg: currentBg,
            ...charaState,
            uiHidden: currentUiHidden
          });
          pendingUiPause = false;
        }
      };

      for (let rawLine of lines) {
        const line = rawLine.trim();
        if (!line || line.startsWith("//")) continue;

        if (line.startsWith("*")) {
          flushPendingPauseIfNeeded();
          const labelName = line.slice(1).trim();
          labels[labelName] = steps.length;
          continue;
        }

        if (line === "@title" || line === "-> *title") {
          flushPendingPauseIfNeeded();
          steps.push({ type: "title" });
          continue;
        }

        if (line.startsWith("->")) {
          flushPendingPauseIfNeeded();
          const target = line.slice(2).trim().replace(/^\*/, "");
          steps.push({ type: "jump", target });
          continue;
        }

        if (line === "@wait") {
          pendingUiPause = false;
          const charaState = consumeCharaState();
          steps.push({
            type: "pause",
            bg: currentBg,
            ...charaState,
            uiHidden: currentUiHidden
          });
          continue;
        }

        if (line === "@bg" || line.startsWith("@bg ")) {
          const val = line.slice(3).trim();
          currentBg = (val === "off" || val === "none" || val === "hide" || val === "無") ? "" : val;
          continue;
        }

        // @chara または @move コマンド
        if (line === "@chara" || line.startsWith("@chara ") || line.startsWith("@move ")) {
          if (pendingCharaMove) {
            flushPendingPauseIfNeeded();
          }
          const arg = line.startsWith("@move ") ? line.slice(6) : line.slice(6);
          const parsed = parseCharaDirective(arg, currentChara);
          currentChara = parsed.key;
          pendingCharaFrom = parsed.from;
          pendingCharaExplicitFrom = parsed.explicitFrom;
          currentCharaTo = parsed.to;
          pendingCharaMove = true;
          continue;
        }

        if (line === "@ui" || line.startsWith("@ui ")) {
          const mode = line.slice(3).trim();
          const nextHidden = (mode === "" || mode === "hide" || mode === "none" || mode === "off" || mode === "無");
          if (currentUiHidden && !nextHidden) {
            flushPendingPauseIfNeeded();
          }
          currentUiHidden = nextHidden;
          if (currentUiHidden) {
            pendingUiPause = true;
          }
          continue;
        }

        if (line.startsWith("##")) {
          pendingUiPause = false;
          const text = line.slice(2).trim();
          const charaState = consumeCharaState();
          steps.push({
            type: "telop",
            text,
            bg: currentBg,
            ...charaState
          });
          continue;
        }

        if (line === "#" || line.startsWith("# ")) {
          const val = line.slice(1).trim();
          currentName = (val === "off" || val === "none" || val === "hide" || val === "無") ? "" : val;
          continue;
        }

        if (line.startsWith("?")) {
          pendingUiPause = false;
          const choiceStr = line.slice(1).trim();
          const choices = choiceStr.split("|").map(part => {
            const [label, targetRaw] = part.split("->");
            return {
              label: label ? label.trim() : "選択",
              target: targetRaw ? targetRaw.trim().replace(/^\*/, "") : ""
            };
          });

          const prevStep = steps[steps.length - 1];
          if (prevStep && prevStep.type === "say") {
            prevStep.choices = choices;
          } else {
            const charaState = consumeCharaState();
            steps.push({
              type: "say",
              name: currentName,
              text: "",
              bg: currentBg,
              ...charaState,
              uiHidden: currentUiHidden,
              choices
            });
          }
          continue;
        }

        // 通常セリフ
        pendingUiPause = false;
        const charaState = consumeCharaState();
        steps.push({
          type: "say",
          name: currentName,
          text: line,
          bg: currentBg,
          ...charaState,
          uiHidden: currentUiHidden,
          choices: null
        });
      }

      flushPendingPauseIfNeeded();
      return { steps, labels };
    }

    const { steps: GAME_STEPS, labels: GAME_LABELS } = parseScenario(SCRIPT_TEXT);

    let currentIndex = 0;
    let typingTimer = null;
    let isTyping = false;
    let isChoosing = false;
    let currentTypingItems = [];
    let historyLog = [];

    function finishTypingImmediately() {
      clearInterval(typingTimer);
      for (const item of currentTypingItems) {
        item.node.textContent = item.fullText;
      }
      isTyping = false;
    }

    function returnToTitle() {
      clearInterval(typingTimer);
      isTyping = false;
      hideChoices();
      clearAllCharaObjects();
      telopLayer.classList.add("hidden");
      logModal.classList.add("hidden");
      closeGlossary();
      currentIndex = 0;
      titleScreen.classList.remove("hidden");
    }

    function renderChoices(choices) {
      isChoosing = true;
      choiceLayer.innerHTML = "";

      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.textContent = choice.label;

        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          historyLog.push({
            index: currentIndex,
            name: "【選択】",
            text: choice.label
          });
          hideChoices();
          jumpToLabel(choice.target);
        });

        choiceLayer.appendChild(btn);
      });

      choiceLayer.classList.remove("hidden");
    }

    function hideChoices() {
      isChoosing = false;
      choiceLayer.innerHTML = "";
      choiceLayer.classList.add("hidden");
    }

    function jumpToLabel(labelName) {
      if (labelName === "title") {
        returnToTitle();
        return;
      }
      if (!(labelName in GAME_LABELS)) {
        showToast(`飛び先「*${labelName}」が見つかりません`);
        return;
      }
      currentIndex = GAME_LABELS[labelName];
      renderStep(currentIndex);
    }

    function renderStep(index, skipTyping = false) {
      let guard = 0;
      while (GAME_STEPS[index] && GAME_STEPS[index].type === "jump") {
        const target = GAME_STEPS[index].target;
        if (target === "title") {
          returnToTitle();
          return;
        }
        if (!(target in GAME_LABELS) || guard > 50) {
          showToast(`飛び先「*${target}」が見つかりません`);
          return;
        }
        index = GAME_LABELS[target];
        currentIndex = index;
        guard++;
      }

      const step = GAME_STEPS[index];
      if (!step || step.type === "title") {
        returnToTitle();
        return;
      }

      hideChoices();
      clearInterval(typingTimer);
      isTyping = false;

      // 背景更新
      const bgSrc = resolveAsset("bg", step.bg);
      if (bgSrc) {
        bgImage.src = bgSrc;
        bgImage.style.display = "block";
      } else {
        bgImage.style.display = "none";
      }

      // キャラクター位置・移動・生成・消去の更新
      updateCharacterObject(step, skipTyping);

      // クリック待機
      if (step.type === "pause") {
        telopLayer.classList.add("hidden");
        if (step.uiHidden) {
          uiLayer.classList.add("hidden");
        } else {
          uiLayer.classList.remove("hidden");
        }
        return;
      }

      // 章タイトル・中央テロップ
      if (step.type === "telop") {
        uiLayer.classList.add("hidden");
        telopText.textContent = step.text;
        telopLayer.classList.remove("hidden");

        const lastLog = historyLog[historyLog.length - 1];
        if (step.text && (!lastLog || lastLog.index !== index)) {
          historyLog.push({
            index: index,
            name: "【章】",
            text: step.text
          });
        }
        return;
      }

      // 通常セリフ
      telopLayer.classList.add("hidden");

      if (step.uiHidden) {
        uiLayer.classList.add("hidden");
      } else {
        uiLayer.classList.remove("hidden");
      }

      if (step.name) {
        charaName.textContent = step.name;
        nameBox.classList.remove("hidden");
      } else {
        charaName.textContent = "";
        nameBox.classList.add("hidden");
      }

      // バックログ追加
      const lastLog = historyLog[historyLog.length - 1];
      if (step.text && (!lastLog || lastLog.index !== index)) {
        historyLog.push({
          index: index,
          name: step.name || "",
          text: step.text
        });
      }

      const onTextComplete = () => {
        isTyping = false;
        if (step.choices && step.choices.length > 0) {
          renderChoices(step.choices);
        }
      };

      currentTypingItems = buildRichTextNodes(messageText, step.text);
      const totalChars = currentTypingItems.reduce((sum, item) => sum + item.fullText.length, 0);

      if (skipTyping || totalChars === 0 || step.uiHidden) {
        onTextComplete();
        return;
      }

      for (const item of currentTypingItems) {
        item.node.textContent = "";
      }

      isTyping = true;
      let charPos = 0;

      typingTimer = setInterval(() => {
        charPos++;
        let remaining = charPos;

        for (const item of currentTypingItems) {
          if (remaining <= 0) {
            item.node.textContent = "";
          } else if (remaining >= item.fullText.length) {
            item.node.textContent = item.fullText;
            remaining -= item.fullText.length;
          } else {
            item.node.textContent = item.fullText.slice(0, remaining);
            remaining = 0;
          }
        }

        if (charPos >= totalChars) {
          clearInterval(typingTimer);
          onTextComplete();
        }
      }, TEXT_SPEED_MS);
    }

    function advance() {
      if (!glossaryModal.classList.contains("hidden")) return;
      if (!titleScreen.classList.contains("hidden")) return;
      if (!logModal.classList.contains("hidden")) return;
      if (isChoosing) return;

      const step = GAME_STEPS[currentIndex];
      if (!step) {
        returnToTitle();
        return;
      }

      if (isTyping) {
        finishTypingImmediately();
        if (step.choices && step.choices.length > 0) {
          renderChoices(step.choices);
        }
        return;
      }

      if (currentIndex < GAME_STEPS.length - 1) {
        currentIndex++;
        renderStep(currentIndex);
      } else {
        returnToTitle();
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add("hidden");
      }, 1800);
    }

    // タイトル画面ボタン
    document.getElementById("btn-start").addEventListener("click", (e) => {
      e.stopPropagation();
      currentIndex = 0;
      historyLog = [];
      clearAllCharaObjects();
      titleScreen.classList.add("hidden");
      renderStep(currentIndex);
    });

    document.getElementById("btn-continue").addEventListener("click", (e) => {
      e.stopPropagation();
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) {
        showToast("セーブデータがありません");
        return;
      }
      const saveData = JSON.parse(raw);
      currentIndex = saveData.currentIndex || 0;
      historyLog = saveData.historyLog || [];
      titleScreen.classList.add("hidden");
      renderStep(currentIndex, true);
      showToast("ロードしました");
    });

    // 画面クリック・キー操作
    gameContainer.addEventListener("click", advance);
    document.addEventListener("keydown", (e) => {
      if (!glossaryModal.classList.contains("hidden")) {
        if (e.key === "Escape" || e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          closeGlossary();
        }
        return;
      }
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        advance();
      }
    });

    // save / Load / log ボタン
    document.getElementById("btn-save").addEventListener("click", (e) => {
      e.stopPropagation();
      const saveData = { currentIndex, historyLog };
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
      showToast("セーブしました");
    });

    document.getElementById("btn-load").addEventListener("click", (e) => {
      e.stopPropagation();
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) {
        showToast("セーブデータがありません");
        return;
      }
      const saveData = JSON.parse(raw);
      currentIndex = saveData.currentIndex || 0;
      historyLog = saveData.historyLog || [];
      renderStep(currentIndex, true);
      showToast("ロードしました");
    });

    document.getElementById("btn-log").addEventListener("click", (e) => {
      e.stopPropagation();
      logList.innerHTML = "";
      for (const item of historyLog) {
        const div = document.createElement("div");
        div.className = "log-item";

        const nameEl = document.createElement("div");
        nameEl.className = "log-name";
        nameEl.textContent = item.name || "（地の文）";

        const textEl = document.createElement("div");
        textEl.className = "log-text";
        buildRichTextNodes(textEl, item.text);

        div.appendChild(nameEl);
        div.appendChild(textEl);
        logList.appendChild(div);
      }
      logModal.classList.remove("hidden");
      logList.scrollTop = logList.scrollHeight;
    });

    document.getElementById("btn-close-log").addEventListener("click", (e) => {
      e.stopPropagation();
      logModal.classList.add("hidden");
    });
    logModal.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    document.getElementById("btn-close-glossary").addEventListener("click", (e) => {
      e.stopPropagation();
      closeGlossary();
    });
    glossaryModal.addEventListener("click", (e) => {
      e.stopPropagation();
      if (e.target === glossaryModal) {
        closeGlossary();
      }
    });

    initTitleScreen();
  </script>
